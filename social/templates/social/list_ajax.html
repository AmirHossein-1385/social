{% for post in posts %}

<div class="post-card">

    <a href="{{ post.get_absolute_url }}" class="post-description">
        {{ post.description|truncatewords:20|linebreaks }}
    </a>

    <div class="post-tags">

        {% for tag in post.tags.all %}

            <a href="{% url 'social:post_list_by_tag' tag.slug %}" class="tag-link">
                #{{ tag }}
            </a>

        {% endfor %}

    </div>

</div>

{% endfor %}
